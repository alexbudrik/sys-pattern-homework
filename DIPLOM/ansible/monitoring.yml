---
- name: Install Yandex Unified Agent
  hosts: web
  become: true

  tasks:
    - name: Install required packages
      apt:
        name:
          - curl
        state: present
        update_cache: true

    - name: Get latest Unified Agent version
      shell: curl -s https://storage.yandexcloud.net/yc-unified-agent/latest-version
      register: ua_version
      changed_when: false

    - name: Download Unified Agent package
      get_url:
        url: "https://storage.yandexcloud.net/yc-unified-agent/releases/{{ ua_version.stdout }}/deb/ubuntu-22.04-jammy/yandex-unified-agent_{{ ua_version.stdout }}_amd64.deb"
        dest: "/tmp/yandex-unified-agent.deb"
        mode: "0644"

    - name: Install Unified Agent
      apt:
        deb: "/tmp/yandex-unified-agent.deb"
        state: present

    - name: Enable and start Unified Agent
      systemd:
        name: unified-agent
        enabled: true
        state: started
